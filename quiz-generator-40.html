let quiz=[],pos=0,score=0,answered=false;

function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function used(){try{return new Set(JSON.parse(localStorage.getItem(USED_KEY)||"[]"))}catch{return new Set()}}
function saveUsed(s){localStorage.setItem(USED_KEY,JSON.stringify([...s]))}

function startQuiz(){
  const u=used();
  const available=BANK.filter(q=>!u.has(q.id));
  if(available.length<QUIZ_SIZE){
    document.getElementById("app").innerHTML =
      `<h2>Question bank එකේ මේ වන විට ${available.length}ක් පමණයි ඉතිරි.</h2>
       <p>එකම ප්‍රශ්නය නැවත නොඑන්න නම් තවත් unique questions add කරන්න.</p>
       <button class="secondary" onclick="resetAll()">Reset used questions</button>`;
    return;
  }
  quiz=shuffle(available).slice(0,QUIZ_SIZE).map(q=>({...q,o:shuffle(q.o.map((label,i)=>({label,correct:i===q.a}))) }));
  pos=0;score=0;answered=false;render();
}
function render(){
  const q=quiz[pos];
  document.getElementById("app").innerHTML=`
    <div><b>ප්‍රශ්නය ${pos+1} / ${QUIZ_SIZE}</b></div>
    <div class="progress"><div class="bar" style="width:${(pos/QUIZ_SIZE)*100}%"></div></div>
    <h2>${q.q}</h2>
    <div id="opts">${q.o.map((x,i)=>`<button class="option" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${x.label}</button>`).join("")}</div>
    <p id="feedback" class="small"></p>
    <button id="next" class="primary" style="display:none" onclick="nextQ()">ඊළඟ</button>`;
}
function choose(i){
  if(answered)return;
  answered=true;
  const q=quiz[pos], buttons=[...document.querySelectorAll(".option")];
  buttons.forEach((b,j)=>{if(q.o[j].correct)b.style.outline="3px solid #16a34a"; if(j===i&&!q.o[j].correct)b.style.outline="3px solid #dc2626"});
  if(q.o[i].correct){score++;document.getElementById("feedback").textContent="නිවැරදියි."; }
  else document.getElementById("feedback").textContent="නිවැරදි පිළිතුර: "+q.o.find(x=>x.correct).label;
  document.getElementById("next").style.display="inline-block";
}
function nextQ(){
  const u=used(); u.add(quiz[pos].id); saveUsed(u);
  pos++; answered=false;
  if(pos<QUIZ_SIZE) render(); else finish();
}
function finish(){
  const u=used();
  quiz.forEach(q=>u.add(q.id)); saveUsed(u);
  document.getElementById("app").innerHTML=`
    <h2>Quiz අවසන්!</h2>
    <p id="result">ලකුණු: ${score} / ${QUIZ_SIZE}</p>
    <p class="small">මෙම Quiz එකේ questions 40ම used list එකට save කර ඇත.</p>
    <button class="primary" onclick="startQuiz()">අලුත් Quiz එකක්</button>
    <button class="secondary" onclick="resetAll()">සියලු used questions reset</button>`;
}
function resetAll(){localStorage.removeItem(USED_KEY);startQuiz()}
startQuiz();
</script>
</body>
</html>
